# cargo-deny configuration for edifact-rs
# Run: cargo deny check

[advisories]
version = 2
# Deny crates that have been yanked from crates.io.
yanked = "deny"
ignore = []

[bans]
# Deny multiple versions of the same crate in the dependency tree.
multiple-versions = "warn"
# Deny wildcard dependencies.
wildcards = "deny"
# Known allowed duplicates (common in transitive graphs).
skip = []

[licenses]
version = 2
# Allow only OSI-approved permissive licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[sources]
# Only allow crates.io as a source.
unknown-registry = "deny"
unknown-git = "deny"
