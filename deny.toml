# cargo-deny configuration for edifact-rs
#
# Run exactly as CI does — the `--all-features` flag matters, because the
# `diagnostics` feature pulls in `miette` and a whole subtree that is invisible
# without it:
#
#   cargo deny --all-features check advisories bans licenses sources

[advisories]
version = 2
# Security advisories, unmaintained crates, and unsound crates are all denied.
# Stated explicitly rather than relying on defaults so a cargo-deny upgrade
# cannot silently relax the gate.
yanked = "deny"
unmaintained = "all"
ignore = []

[bans]
# Duplicate versions are reported but do not fail the build.
#
# Every duplicate this workspace sees originates inside a dependency's own tree
# and cannot be reconciled from here — the current example is `syn`, where
# `thiserror-impl` and `serde_derive` have moved to 3.x while `miette-derive`
# is still on 2.x. Nothing this crate can change resolves that; the proc-macro
# ecosystem is mid-migration.
#
# Denying duplicates would therefore mean a growing `skip` list and a CI break
# on every unrelated transitive bump, which trains people to ignore the gate.
# Revisit once the syn 2 -> 3 migration settles.
multiple-versions = "warn"
wildcards = "deny"
skip = []

[licenses]
version = 2
# OSI-approved permissive licenses only.
#
# This list is deliberately broader than what the current dependency graph
# happens to use, so a routine dependency bump does not fail CI on a license
# that was always going to be acceptable. `unused-allowed-license` is therefore
# set to "allow" — otherwise every forward-looking entry emits a warning, and
# trimming entries to silence those warnings is exactly how ISC came to be
# missing when the graph later needed it.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"
# The cargo-deny default. A lower threshold accepts fuzzier matches against
# license text, which is how an unexpected license slips through.
confidence-threshold = 0.93

[sources]
# Only allow crates.io as a source.
unknown-registry = "deny"
unknown-git = "deny"
