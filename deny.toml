# cargo-deny configuration for edifact-rs
# Run: cargo deny check

[advisories]
version = 2
# Security advisories, unmaintained crates, and unsound crates are all denied.
# Stated explicitly rather than relying on defaults so a cargo-deny upgrade
# cannot silently relax the gate.
yanked = "deny"
unmaintained = "all"
ignore = []

[bans]
# Duplicate versions of a crate inflate compile times and binary size. Denied
# outright; add a documented entry to `skip` when a transitive graph genuinely
# forces one.
multiple-versions = "deny"
wildcards = "deny"
skip = []

[licenses]
version = 2
# OSI-approved permissive licenses only. Entries beyond MIT/Apache-2.0 are ones
# that appear in this crate's actual transitive graph or are near-certain to,
# listed up front so a routine dependency bump does not break CI.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]
# The cargo-deny default. A lower threshold accepts fuzzier matches against
# license text, which is how an unexpected license slips through.
confidence-threshold = 0.93

[sources]
# Only allow crates.io as a source.
unknown-registry = "deny"
unknown-git = "deny"
